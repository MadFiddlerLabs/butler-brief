# Checks the plugin the way Anthropic's plugin directory does, on every push and pull request.
name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Claude Code's plugin checks, as strict as the directory's
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.311 plugin validate --strict .
          npx --yes @anthropic-ai/claude-code@2.1.311 plugin validate --strict --profile directory .
